name: verify
on: [push, pull_request]
permissions:
  contents: read
jobs:
  software:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        compiler: [clang, gcc]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python scripts/build.py --test
        env:
          CC: ${{ matrix.compiler }}
  hardware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: sudo apt-get update && sudo apt-get install -y iverilog yosys clang
      - run: python scripts/build.py --test --sanitize
      - run: python scripts/analyze.py
      - run: python scripts/rtl.py --test --synth
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-logs
          path: target/*.log
